<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
        /* Reset & Base */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Particles */
        .particles {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* 404 Container */
        .error-container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
        }
        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            animation: pulse 2s ease-in-out infinite alternate;
            letter-spacing: 0.1em;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 20px rgba(255, 107, 107, 0.5); }
            to { text-shadow: 0 0 40px rgba(255, 107, 107, 0.8), 0 0 60px rgba(254, 202, 87, 0.6); }
        }

        .error-message {
            margin: 1.5rem 0;
            font-size: 1.5rem;
            opacity: 0.9;
            animation: fadeIn 1s ease-out 0.5s forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            to { opacity: 0.9; }
        }

        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before, .glitch::after {
            content: 'PAGE NOT FOUND';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: inherit;
            clip-path: inherit;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            animation: glitch-1 0.5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: 2px 0 #00fffb;
            animation: glitch-2 0.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-1 {
            0%, 100% { clip-path: polygon(0 0, 100% 0, 100% 20%, 0 20%); }
            50% { clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%); }
        }
        @keyframes glitch-2 {
            0%, 100% { clip-path: polygon(0 80%, 100% 80%, 100% 100%, 0 100%); }
            50% { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); }
        }

        /* Action Button */
        .home-btn {
            margin-top: 2rem;
            display: inline-block;
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .home-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .home-btn:hover {
            border-color: #feca57;
            box-shadow: 0 0 20px rgba(254, 202, 87, 0.5);
            transform: translateY(-3px);
        }
        .home-btn:hover::before {
            left: 100%;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .error-message { font-size: 1.2rem; }
            .home-btn { padding: 0.7rem 1.5rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">
            <span class="glitch">PAGE NOT FOUND</span>
        </h2>
        <p>Looks like this page took a wrong turn in the digital cosmos.</p>
        <a href="/" class="home-btn">Beam Me Home</a>
    </div>

    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 5 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.animationDelay = `${Math.random() * 15}s`;
            particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
