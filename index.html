<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Site - Gomega, ScriptNova & GPD</title>
    <style>
        /* Reset & Base */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #0f0;
            overflow: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 219, 226, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(100, 255, 150, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 200, 100, 0.05) 0%, transparent 70%);
        }

        /* Terminal Cursor Blink */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background: #0f0;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Matrix Rain Background */
        .matrix {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            opacity: 0.15;
        }
        canvas { display: block; }

        /* Main Content */
        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #0f0;
            border-radius: 8px;
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.3),
                inset 0 0 10px rgba(0, 255, 0, 0.1);
            backdrop-filter: blur(5px);
        }

        .glitch-text {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: bold;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
            color: #0f0;
            text-shadow: 
                0 0 5px #0f0,
                0 0 10px #0f0,
                0 0 20px #0f0;
        }
        .glitch-text::before, .glitch-text::after {
            content: 'Yo this is just a test website';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .glitch-text::before {
            color: #f0f;
            left: 2px;
            text-shadow: -2px 0 #f0f;
            animation: glitch1 0.8s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }
        .glitch-text::after {
            color: #0ff;
            left: -2px;
            text-shadow: 2px 0 #0ff;
            animation: glitch2 0.6s infinite;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }
        @keyframes glitch1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, 0); }
        }
        @keyframes glitch2 {
            0%, 100% { transform: translate(0); }
            30% { transform: translate(2px, -1px); }
            70% { transform: translate(-2px, 1px); }
        }

        .subtitle {
            font-size: 1.3rem;
            margin: 1.5rem 0;
            color: #0b0;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.8s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .browsers {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin: 2rem 0;
        }
        .browser-card {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #0f0;
            padding: 1rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            transition: all 0.3s ease;
            min-width: 180px;
        }
        .browser-card:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            transform: translateY(-5px);
        }

        .status {
            margin-top: 2rem;
            font-size: 1.1rem;
            color: #0f0;
        }
        .status span {
            color: #0f0;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .browsers { flex-direction: column; align-items: center; }
            .browser-card { width: 80%; }
        }
    </style>
</head>
<body>
    <canvas class="matrix" id="matrix"></canvas>

    <div class="container">
        <h1 class="glitch-text">Yo this is just a test website<span class="cursor"></span></h1>
        <p class="subtitle">and used for getting into</p>
        
        <div class="browsers">
            <div class="browser-card">Gomega Browser</div>
            <div class="browser-card">ScriptNova Browser</div>
            <div class="browser-card">GPD</div>
        </div>

        <p class="status">Status: <span>ONLINE</span> // Connection Secure</p>
    </div>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+-=[]{}|;:,.<>?';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0f0';
            ctx.font = `${fontSize}px monospace`;
            
            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;
                
                ctx.fillText(text, x, y);
                
                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
